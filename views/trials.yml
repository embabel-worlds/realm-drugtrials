# Reusable Virtual Cypher views. The node views compose into Lenses (and other
# views) by being referenced as labels; the tabular views are directly runnable
# reports through POST /api/v1/views/{name}/invoke.

- name: DiseaseTrialRuns
  description: >-
    The live ClinicalTrials.gov search for one disease expression, as a node. Its trials (RETURNED) and
    coverage (HAS_COVERAGE) are reachable from it. One search per call, up to 10,000 trials; when the
    sweep hits that cap its coverage says PARTIAL_PAGE_CAP.
  outputLabel: TrialSearchRun
  params:
    registryQuery:
      type: string
      default: '"Long COVID" OR "Post-Acute Sequelae of SARS-CoV-2" OR PASC OR "Post-COVID Condition"'
      description: "The disease phrase or ClinicalTrials.gov condition expression to search; rewritten into the registry's Essie syntax before it is sent."
  cypher: |
    MATCH (scope:DiseaseScope {registryQuery: $registryQuery})-[:HAS_TRIAL_SEARCH]->(run:TrialSearchRun)
    RETURN run

- name: DiseaseTrials
  description: >-
    The registered trials for one disease expression, as nodes to traverse further. Bounded by the
    search's cap of 10,000 trials; covers only the expression given, never related conditions it does
    not name. For a table use TrialLandscape.
  outputLabel: ClinicalTrial
  params:
    registryQuery:
      type: string
      default: '"Long COVID" OR "Post-Acute Sequelae of SARS-CoV-2" OR PASC OR "Post-COVID Condition"'
      description: "The disease phrase or ClinicalTrials.gov condition expression to search; rewritten into the registry's Essie syntax before it is sent."
  cypher: |
    MATCH (scope:DiseaseScope {registryQuery: $registryQuery})-[:HAS_TRIAL_SEARCH]->(run:TrialSearchRun)
    MATCH (run)-[:RETURNED]->(trial:ClinicalTrial)
    RETURN DISTINCT trial

- name: TrialProtocol
  description: >-
    The full protocol detail for one trial, by NCT id. Exactly one trial; outcomes and cited
    references hang off the node, and references resolve to PubMed. Not the trial's posted results.
  outputLabel: TrialDetail
  params:
    nctId:
      type: string
      default: NCT05585970
      description: "ClinicalTrials.gov NCT identifier, e.g. NCT05585970: NCT and eight digits."
  cypher: |
    MATCH (trial:ClinicalTrial {registryRecordId: $nctId})-[:HAS_CURRENT_DETAIL]->(detail:TrialDetail)
    RETURN detail

- name: TrialLandscape
  description: >-
    Every registered trial for one disease, one row each, with search coverage. Current registry
    fields only, newest-updated first; at most 10,000 trials, and when coverageState is
    PARTIAL_PAGE_CAP the list is not the whole registry answer. No protocol detail or publications.
  params:
    registryQuery:
      type: string
      default: '"Long COVID" OR "Post-Acute Sequelae of SARS-CoV-2" OR PASC OR "Post-COVID Condition"'
      description: "The disease phrase or ClinicalTrials.gov condition expression to search; rewritten into the registry's Essie syntax before it is sent."
  cypher: |
    MATCH (run:DiseaseTrialRuns {registryQuery: $registryQuery})
    MATCH (run)-[:HAS_COVERAGE]->(coverage:TrialCoverage)
    OPTIONAL MATCH (run)-[:RETURNED]->(trial:ClinicalTrial)
    RETURN run.dataTimestamp AS dataTimestamp, run.retrievedAt AS retrievedAt,
           coverage.state AS coverageState, coverage.detail AS coverageDetail,
           trial.nctId AS nctId, trial.title AS title, trial.overallStatus AS status,
           trial.studyType AS studyType, trial.phases AS phases, trial.sponsor AS sponsor,
           trial.countries AS countries, trial.hasResults AS hasRegistryResults,
           trial.whyStopped AS whyStopped, trial.registryUrl AS registryUrl
    ORDER BY trial.lastUpdated DESC, trial.nctId ASC

- name: CompletedTrialsWithoutRegistryResults
  description: >-
    Completed trials for a disease with no results posted to the registry. An investigation queue,
    not a legal finding: results may be published elsewhere, and trials that are terminated, still
    running or exempt are left out. Oldest completion first.
  params:
    registryQuery:
      type: string
      default: '"Long COVID" OR "Post-Acute Sequelae of SARS-CoV-2" OR PASC OR "Post-COVID Condition"'
      description: "The disease phrase or ClinicalTrials.gov condition expression to search; rewritten into the registry's Essie syntax before it is sent."
  cypher: |
    MATCH (trial:DiseaseTrials {registryQuery: $registryQuery})
    WHERE trial.overallStatus = 'COMPLETED' AND trial.hasResults = false
    RETURN trial.nctId AS nctId, trial.title AS title, trial.sponsor AS sponsor,
           trial.completionDate AS completionDate, trial.lastUpdated AS lastUpdated,
           trial.registryUrl AS registryUrl
    ORDER BY trial.completionDate ASC, trial.nctId ASC

- name: RecruitingTrialsByCountry
  description: >-
    Trials for a disease recruiting now with a site in one country. Only overallStatus RECRUITING:
    not-yet-recruiting and invitation-only trials are left out. The country must be spelled as the
    registry spells it.
  params:
    registryQuery:
      type: string
      default: '"Long COVID" OR "Post-Acute Sequelae of SARS-CoV-2" OR PASC OR "Post-COVID Condition"'
      description: "The disease phrase or ClinicalTrials.gov condition expression to search; rewritten into the registry's Essie syntax before it is sent."
    country:
      type: string
      default: Australia
      description: "Country name exactly as ClinicalTrials.gov spells it (e.g. Australia, United States, Korea, Republic of); matched exactly, not partially."
  cypher: |
    MATCH (trial:DiseaseTrials {registryQuery: $registryQuery})
    WHERE trial.overallStatus = 'RECRUITING' AND $country IN trial.countries
    RETURN trial.nctId AS nctId, trial.title AS title, trial.sponsor AS sponsor,
           trial.phases AS phases, trial.countries AS countries, trial.registryUrl AS registryUrl
    ORDER BY trial.nctId ASC

